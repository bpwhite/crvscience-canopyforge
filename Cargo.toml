[package]
name = "canopyforge"
version = "1.0.0"
edition = "2021"
authors = ["Bryan P. White <crvscience.com>"]
license = "GPL-3.0-or-later"
description = "High-fidelity native safe-Rust 3D isometric Pacific Northwest old-growth ecosystem recovery idle & active stewardship game"
repository = "https://github.com/bpwhite/crvscience-canopyforge"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
